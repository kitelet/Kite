<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌊 Tailwind CSS — Kite Styling</title>
    <link rel="stylesheet" href="../shared.css" />
    <!-- Tailwind CSS Play CDN for standalone demo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="../../src/kite.js"></script>
  </head>
  <body>

    <!-- Topbar Navigation -->
    <div class="kite-topbar">
      <a href="../index.html" class="kite-back-link">
        <svg class="kite-icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        <span>Gallery</span>
      </a>
      <span class="kite-chip">🎨 Universal Styling</span>
    </div>

    <!-- Main Card Container -->
    <div class="w-full max-w-xl bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl backdrop-blur-sm"
         kite-scope="{
           isOnline: true,
           unreadCount: 3,
           toggleStatus() { this.isOnline = !this.isOnline; },
           markAllRead() { this.unreadCount = 0; }
         }">
      <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-4">
        <div>
          <h1 class="text-xl font-bold text-white tracking-tight">🌊 Tailwind CSS Integration</h1>
          <p class="text-sm text-slate-400 mt-1">Utility-first classes work without conflicts or overrides.</p>
        </div>
        <span class="px-3 py-1 text-xs font-semibold rounded-full tracking-wide transition-colors"
              kite-class:bg-emerald-500/20="isOnline"
              kite-class:text-emerald-400="isOnline"
              kite-class:border-emerald-500/30="isOnline"
              kite-class:bg-rose-500/20="!isOnline"
              kite-class:text-rose-400="!isOnline"
              kite-class:border-rose-500/30="!isOnline"
              class="border">
          <span kite-if="isOnline">🟢 Online</span>
          <span kite-if="!isOnline">🔴 Away</span>
        </span>
      </div>

      <div class="space-y-3">
        <div class="p-4 rounded-xl bg-slate-900/60 border border-slate-700/60 flex items-center justify-between">
          <div>
            <div class="font-medium text-slate-200">Unread Notifications</div>
            <div class="text-xs text-slate-400">Live reactive badge bound with Tailwind utilities</div>
          </div>
          <span class="inline-flex items-center justify-center px-2.5 py-1 text-xs font-bold leading-none text-sky-950 bg-sky-400 rounded-full"
                kite-text="unreadCount">3</span>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button"
                  kite-on-click="toggleStatus()"
                  class="flex-1 px-4 py-2 text-sm font-medium text-white bg-slate-700 hover:bg-slate-600 rounded-lg transition-all active:scale-95">
            🔄 Toggle Status
          </button>
          <button type="button"
                  kite-on-click="markAllRead()"
                  kite-bind:disabled="unreadCount === 0"
                  class="flex-1 px-4 py-2 text-sm font-medium text-slate-900 bg-sky-400 hover:bg-sky-300 disabled:opacity-40 disabled:pointer-events-none rounded-lg font-semibold transition-all active:scale-95">
            ✅ Mark All Read
          </button>
        </div>
      </div>
    </div>

    <!-- Official Banner Footer -->
    <footer class="kite-footer">
      <a href="../index.html" title="Kite Examples Gallery">
        <img src="../../assets/kite-banner.svg" alt="Kite Toolkit" class="kite-footer-banner">
      </a>
      <div class="kite-footer-meta">
        HTML is enough for small things &bull; <a href="../index.html">← All Examples</a>
      </div>
    </footer>

  </body>
</html>
