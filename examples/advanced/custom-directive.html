<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔌 Custom Directive Plugin — Kite Example</title>
    <link rel="stylesheet" href="../shared.css" />
    <script type="module">
      import { Kite } from '../../src/kite.js';

      // Register a custom directive: kite-tooltip="Tooltip Text"
      Kite.directive('tooltip', (el, value, scope) => {
        el.style.position = 'relative';
        el.style.cursor = 'help';

        const tip = document.createElement('div');
        tip.className = 'custom-tooltip';
        tip.textContent = value;
        tip.style.position = 'absolute';
        tip.style.bottom = '120%';
        tip.style.left = '50%';
        tip.style.transform = 'translateX(-50%)';
        tip.style.background = '#0284c7';
        tip.style.color = '#ffffff';
        tip.style.padding = '0.35rem 0.65rem';
        tip.style.borderRadius = '6px';
        tip.style.fontSize = '0.75rem';
        tip.style.whiteSpace = 'nowrap';
        tip.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
        tip.style.display = 'none';
        tip.style.pointerEvents = 'none';
        tip.style.zIndex = '100';

        el.appendChild(tip);

        const onEnter = () => { tip.style.display = 'block'; };
        const onLeave = () => { tip.style.display = 'none'; };

        el.addEventListener('mouseenter', onEnter);
        el.addEventListener('mouseleave', onLeave);

        return () => {
          el.removeEventListener('mouseenter', onEnter);
          el.removeEventListener('mouseleave', onLeave);
          tip.remove();
        };
      });
    </script>
  </head>
  <body>

    <!-- Topbar Navigation -->
    <div class="kite-topbar">
      <a href="../index.html" class="kite-back-link">
        <svg class="kite-icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        <span>Gallery</span>
      </a>
      <span class="kite-chip">🔌 Plugins</span>
    </div>

    <!-- Main Card Container -->
    <div class="kite-card">
      <h1 class="kite-title">🔌 Custom Directive Plugin</h1>
      <p class="kite-desc">Extend Kite's compiler by writing custom HTML attributes with <code>Kite.directive()</code>.</p>

      <div style="display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap;">
        <button class="kite-btn kite-btn-primary" kite-tooltip="✨ I am a reactive custom tooltip!">
          Hover Over Me
        </button>
        <button class="kite-btn kite-btn-secondary" kite-tooltip="🚀 Built with Kite.directive() in 15 lines of code">
          Another Tooltip Target
        </button>
      </div>
    </div>

    <!-- Official Banner Footer -->
    <footer class="kite-footer">
      <a href="../index.html" title="Kite Examples Gallery">
        <img src="../../assets/kite-banner.svg" alt="Kite Toolkit" class="kite-footer-banner">
      </a>
      <div class="kite-footer-meta">
        HTML is enough for small things &bull; <a href="../index.html">← All Examples</a>
      </div>
    </footer>

  </body>
</html>
