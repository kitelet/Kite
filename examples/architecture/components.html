<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧩 Reusable Components — Kite Example</title>
    <link rel="stylesheet" href="../shared.css" />
    <script type="module" src="../../src/kite.js"></script>
  </head>
  <body>

    <!-- Topbar Navigation -->
    <div class="kite-topbar">
      <a href="../index.html" class="kite-back-link">
        <svg class="kite-icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        <span>Gallery</span>
      </a>
      <span class="kite-chip">🏛️ Architecture</span>
    </div>

    <!-- Component Definition -->
    <kite-component name="user-badge">
      <template>
        <div style="display: flex; align-items: center; gap: 0.75rem; background: rgba(11, 17, 32, 0.6); padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--kite-card-border); margin-bottom: 0.75rem;">
          <div style="width: 36px; height: 36px; border-radius: 50%; background: var(--kite-primary); color: #0f172a; display: flex; align-items: center; justify-content: center; font-weight: bold;" kite-text="initials">AB</div>
          <div style="flex: 1;">
            <div style="font-weight: 600; font-size: 0.95rem;" kite-text="name">Ada Lovelace</div>
            <div style="font-size: 0.8rem; color: var(--kite-text-muted);" kite-text="title">Computer Pioneer</div>
          </div>
          <span class="kite-badge" kite-text="status">Active</span>
        </div>
      </template>
    </kite-component>

    <!-- Main Card Container -->
    <div class="kite-card" kite-scope="{
      team: [
        { name: 'Ada Lovelace', initials: 'AL', title: 'Mathematician', status: 'Online' },
        { name: 'Alan Turing', initials: 'AT', title: 'Cryptanalyst', status: 'In Call' },
        { name: 'Grace Hopper', initials: 'GH', title: 'Systems Architect', status: 'Offline' }
      ]
    }">
      <h1 class="kite-title">🧩 Declarative Components</h1>
      <p class="kite-desc">Reusable <code>&lt;kite-component&gt;</code> template definitions, isolated scopes, dynamic prop passing, and slots.</p>

      <div kite-for="member in team">
        <kite-use name="user-badge"
                  kite-bind:name="member.name"
                  kite-bind:initials="member.initials"
                  kite-bind:title="member.title"
                  kite-bind:status="member.status"></kite-use>
      </div>
    </div>

    <!-- Official Banner Footer -->
    <footer class="kite-footer">
      <a href="../index.html" title="Kite Examples Gallery">
        <img src="../../assets/kite-banner.svg" alt="Kite Toolkit" class="kite-footer-banner">
      </a>
      <div class="kite-footer-meta">
        HTML is enough for small things &bull; <a href="../index.html">← All Examples</a>
      </div>
    </footer>

  </body>
</html>
