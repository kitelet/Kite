<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📊 Reusable Data Table — Kite Example</title>
    <link rel="stylesheet" href="../shared.css" />
    <script type="module" src="../../src/kite.js"></script>
    <style>
      .data-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
      .data-table th { padding: 0.65rem 0.85rem; background: rgba(11, 17, 32, 0.6); color: var(--kite-text-muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid var(--kite-card-border); }
      .data-table td { padding: 0.75rem 0.85rem; border-bottom: 1px solid var(--kite-card-border); }
      .data-table tr:hover td { background: rgba(51, 65, 85, 0.2); }
      .filter-input { width: 100%; margin-bottom: 1rem; }
    </style>
  </head>
  <body>

    <!-- Topbar Navigation -->
    <div class="kite-topbar">
      <a href="../index.html" class="kite-back-link">
        <svg class="kite-icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        <span>Gallery</span>
      </a>
      <span class="kite-chip">📊 Level 2 Component</span>
    </div>

    <!-- Reusable Component Definition -->
    <kite-component name="data-table">
      <template>
        <div style="overflow-x: auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Role</th>
                <th>Department</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr kite-for="row in rows">
                <td style="font-family: monospace; color: var(--kite-text-muted);" kite-text="row.id">1</td>
                <td style="font-weight: 600;" kite-text="row.name">Alex</td>
                <td kite-text="row.role">Dev</td>
                <td kite-text="row.dept">Eng</td>
                <td>
                  <span class="kite-badge" kite-text="row.status">Active</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </template>
    </kite-component>

    <!-- Main Card Container -->
    <div class="kite-card" kite-scope="{
      filter: '',
      allUsers: [
        { id: 101, name: 'Ada Lovelace', role: 'Architect', dept: 'Engineering', status: 'Active' },
        { id: 102, name: 'Alan Turing', role: 'Cryptanalyst', dept: 'Security', status: 'Active' },
        { id: 103, name: 'Grace Hopper', role: 'Compiler Lead', dept: 'Engineering', status: 'Away' },
        { id: 104, name: 'Claude Shannon', role: 'Information Theory', dept: 'Research', status: 'Active' }
      ],
      filteredUsers() {
        if (!this.filter.trim()) return this.allUsers;
        const q = this.filter.toLowerCase();
        return this.allUsers.filter(u => u.name.toLowerCase().includes(q) || u.dept.toLowerCase().includes(q));
      }
    }">
      <h1 class="kite-title">📊 Reusable Data Table</h1>
      <p class="kite-desc">Encapsulated rendering, dynamic table columns, and live filtering with custom row data binding.</p>

      <input class="kite-input filter-input" type="text" placeholder="🔍 Filter by name or department..." kite-model="filter" />

      <kite-use name="data-table" kite-bind:rows="filteredUsers()"></kite-use>

      <div style="margin-top: 1rem; font-size: 0.85rem; color: var(--kite-text-muted); text-align: right;">
        Showing <strong kite-text="filteredUsers().length"></strong> of <span kite-text="allUsers.length"></span> team members
      </div>
    </div>

    <!-- Official Banner Footer -->
    <footer class="kite-footer">
      <a href="../index.html" title="Kite Examples Gallery">
        <img src="../../assets/kite-banner.svg" alt="Kite Toolkit" class="kite-footer-banner">
      </a>
      <div class="kite-footer-meta">
        HTML is enough for small things &bull; <a href="../index.html">← All Examples</a>
      </div>
    </footer>

  </body>
</html>
