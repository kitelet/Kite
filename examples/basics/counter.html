<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ Reactive Counter — Kite Example</title>
    <link rel="stylesheet" href="../shared.css" />
    <script type="module" src="../../src/kite.js"></script>
  </head>
  <body>

    <!-- Topbar Navigation -->
    <div class="kite-topbar">
      <a href="../index.html" class="kite-back-link">
        <svg class="kite-icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        <span>Gallery</span>
      </a>
      <span class="kite-chip">⚡ Basics</span>
    </div>

    <!-- Main Card Container -->
    <div class="kite-card" kite-scope="{ count: 0 }">
      <h1 class="kite-title">⚡ Reactive Counter</h1>
      <p class="kite-desc">Zero-build, proxy-driven single-state counter using <code>kite-on-click</code> and <code>kite-text</code>.</p>

      <div style="font-size: 3.5rem; font-weight: 700; color: var(--kite-primary); margin: 1.5rem 0 1rem; text-align: center;" kite-text="count">0</div>

      <div class="kite-btn-group" style="justify-content: center; gap: 0.75rem;">
        <button class="kite-btn kite-btn-primary" kite-on-click="count++">➕ Increment</button>
        <button class="kite-btn kite-btn-secondary" kite-on-click="count--">➖ Decrement</button>
        <button class="kite-btn kite-btn-secondary" kite-on-click="count = 0">🔄 Reset</button>
      </div>
    </div>

    <!-- Official Banner Footer -->
    <footer class="kite-footer">
      <a href="../index.html" title="Kite Examples Gallery">
        <img src="../../assets/kite-banner.svg" alt="Kite Toolkit" class="kite-footer-banner">
      </a>
      <div class="kite-footer-meta">
        HTML is enough for small things &bull; <a href="../index.html">← All Examples</a>
      </div>
    </footer>

  </body>
</html>
