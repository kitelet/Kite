<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧮 Calculator — Kite Example</title>
    <link rel="stylesheet" href="../shared.css" />
    <script type="module" src="../../src/kite.js"></script>
    <style>
      .calc-display { background: var(--kite-input-bg); border: 1px solid var(--kite-input-border); border-radius: 8px; padding: 1rem; font-size: 1.75rem; text-align: right; font-family: monospace; color: var(--kite-primary); margin-bottom: 1rem; min-height: 2.2rem; word-break: break-all; }
      .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
      .calc-btn { padding: 0.85rem; font-size: 1.1rem; border-radius: 8px; border: 1px solid var(--kite-card-border); background: rgba(30, 41, 59, 0.7); color: var(--kite-text); cursor: pointer; transition: background 0.15s ease; }
      .calc-btn:hover { background: rgba(51, 65, 85, 0.9); }
      .calc-btn.op { background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.35); color: var(--kite-primary); }
    </style>
  </head>
  <body>

    <!-- Topbar Navigation -->
    <div class="kite-topbar">
      <a href="../index.html" class="kite-back-link">
        <svg class="kite-icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        <span>Gallery</span>
      </a>
      <span class="kite-chip">⚡ Basics</span>
    </div>

    <!-- Main Card Container -->
    <div class="kite-card" kite-scope="{
      val: '0',
      press(char) {
        if (this.val === '0' || this.val === 'Error') this.val = String(char);
        else this.val += String(char);
      },
      clear() { this.val = '0'; },
      calculate() {
        try {
          const sanitized = this.val.replace(/×/g, '*').replace(/÷/g, '/').replace(/[^0-9+\-*/.()]/g, '');
          const fn = new Function('return (' + sanitized + ')');
          const res = fn();
          this.val = (res !== undefined && !isNaN(res)) ? String(res) : 'Error';
        } catch {
          this.val = 'Error';
        }
      }
    }">
      <h1 class="kite-title">🧮 Interactive Calculator</h1>
      <p class="kite-desc">Mathematical state operations, expression evaluation, and event dispatch.</p>

      <div class="calc-display" kite-text="val">0</div>

      <div class="calc-grid">
        <button class="calc-btn op" type="button" kite-on-click="clear()">C</button>
        <button class="calc-btn op" type="button" kite-on-click="press('(')">(</button>
        <button class="calc-btn op" type="button" kite-on-click="press(')')">)</button>
        <button class="calc-btn op" type="button" kite-on-click="press('÷')">÷</button>

        <button class="calc-btn" type="button" kite-on-click="press('7')">7</button>
        <button class="calc-btn" type="button" kite-on-click="press('8')">8</button>
        <button class="calc-btn" type="button" kite-on-click="press('9')">9</button>
        <button class="calc-btn op" type="button" kite-on-click="press('×')">×</button>

        <button class="calc-btn" type="button" kite-on-click="press('4')">4</button>
        <button class="calc-btn" type="button" kite-on-click="press('5')">5</button>
        <button class="calc-btn" type="button" kite-on-click="press('6')">6</button>
        <button class="calc-btn op" type="button" kite-on-click="press('-')">-</button>

        <button class="calc-btn" type="button" kite-on-click="press('1')">1</button>
        <button class="calc-btn" type="button" kite-on-click="press('2')">2</button>
        <button class="calc-btn" type="button" kite-on-click="press('3')">3</button>
        <button class="calc-btn op" type="button" kite-on-click="press('+')">+</button>

        <button class="calc-btn" type="button" kite-on-click="press('0')">0</button>
        <button class="calc-btn" type="button" kite-on-click="press('.')">.</button>
        <button class="calc-btn op" type="button" style="grid-column: span 2; background: var(--kite-primary); color: #0f172a; font-weight: bold;" kite-on-click="calculate()">=</button>
      </div>
    </div>

    <!-- Official Banner Footer -->
    <footer class="kite-footer">
      <a href="../index.html" title="Kite Examples Gallery">
        <img src="../../assets/kite-banner.svg" alt="Kite Toolkit" class="kite-footer-banner">
      </a>
      <div class="kite-footer-meta">
        HTML is enough for small things &bull; <a href="../index.html">← All Examples</a>
      </div>
    </footer>

  </body>
</html>
