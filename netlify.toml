# Netlify Configuration for Kite Documentation Portal (https://getkite.netlify.app)

[build]
  publish = "docs"

# Production Security & Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Strict Enterprise CSP without 'unsafe-eval'
    Content-Security-Policy = "default-src 'self' https://esm.sh; script-src 'self' 'unsafe-inline' https://esm.sh https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://esm.sh https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://esm.sh https://api.github.com;"

# Cache static markdown and assets
[[headers]]
  for = "*.md"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Single-Page Application Hash Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
