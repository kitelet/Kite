<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kite Administrative Analytics Dashboard">
  <title>Kite Admin Dashboard</title>

  <!-- Styles -->
  <link rel="stylesheet" href="/styles/app.css">

  <!-- Kite runtime -->
  <script src="/kite.js" defer></script>
</head>
<body kite-cloak>

  <div class="dash-layout">
    <!-- Sidebar Component -->
    <kite-include src="/app/components/sidebar.component.html"></kite-include>
    <kite-use name="dash-sidebar"></kite-use>

    <!-- Stat Card Component -->
    <kite-include src="/app/components/stat-card.component.html"></kite-include>

    <!-- Dashboard Model -->
    <kite-include src="/app/models/dashboard.model.html"></kite-include>

    <!-- Views -->
    <kite-include src="/app/views/overview.view.html"></kite-include>
    <kite-include src="/app/views/analytics.view.html"></kite-include>

    <!-- Routes -->
    <kite-include src="/app/routes/routes.html"></kite-include>

    <!-- Main Content Area with Outlet -->
    <main class="dash-main">
      <kite-outlet></kite-outlet>
    </main>
  </div>

</body>
</html>
