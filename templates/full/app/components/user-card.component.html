<kite-component name="user-card" props="profile">
  <template>
    <div class="user-card">
      <div class="avatar" kite-text="profile.name[0]">A</div>
      <div class="user-info">
        <strong kite-text="profile.name">Name</strong>
        <small kite-text="profile.email">email</small>
      </div>
    </div>
  </template>
</kite-component>
