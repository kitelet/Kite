<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <!-- Facet Gradients -->
    <linearGradient id="facetTopLeft" x1="16" y1="6" x2="32" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="facetTopRight" x1="48" y1="6" x2="32" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="facetBottomLeft" x1="16" y1="28" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="facetBottomRight" x1="48" y1="28" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <!-- Tail Curve Gradient -->
    <linearGradient id="tailGrad" x1="32" y1="48" x2="18" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="kiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Kite Body with Shadow -->
  <g filter="url(#kiteGlow)">
    <!-- Top-Left Facet -->
    <polygon points="32,6 14,26 32,26" fill="url(#facetTopLeft)"/>
    <!-- Top-Right Facet -->
    <polygon points="32,6 32,26 50,26" fill="url(#facetTopRight)"/>
    <!-- Bottom-Left Facet -->
    <polygon points="14,26 32,48 32,26" fill="url(#facetBottomLeft)"/>
    <!-- Bottom-Right Facet -->
    <polygon points="32,26 32,48 50,26" fill="url(#facetBottomRight)"/>
    
    <!-- Center Spine & Spar Highlights -->
    <line x1="32" y1="6" x2="32" y2="48" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="14" y1="26" x2="50" y2="26" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" stroke-linecap="round"/>
    <!-- Perimeter Crisp Edge -->
    <polygon points="32,6 50,26 32,48 14,26" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.8"/>
  </g>

  <!-- Flowing Tail Line -->
  <path d="M 32,48 C 30,53 23,55 25,58 C 26,60 30,60 28,63" fill="none" stroke="url(#tailGrad)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Minimalist Geometric Tail Ribbons (Bows) -->
  <!-- Bow 1: Emerald -->
  <g transform="translate(24, 55.5) rotate(-15)">
    <polygon points="-2.5,-1.5 0,0 -2.5,1.5" fill="#10b981"/>
    <polygon points="2.5,-1.5 0,0 2.5,1.5" fill="#34d399"/>
    <circle cx="0" cy="0" r="0.8" fill="#ffffff"/>
  </g>

  <!-- Bow 2: Amber -->
  <g transform="translate(26.5, 60.5) rotate(20)">
    <polygon points="-2.2,-1.3 0,0 -2.2,1.3" fill="#f59e0b"/>
    <polygon points="2.2,-1.3 0,0 2.2,1.3" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="0.7" fill="#ffffff"/>
  </g>
</svg>