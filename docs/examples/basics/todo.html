<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✅ Todo Application — Kite Example</title>
    <link rel="stylesheet" href="../shared.css" />
    <script type="module" src="../../src/kite.js"></script>
    <style>
      .todo-input-row { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
      .todo-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.5rem; }
      .todo-item { display: flex; align-items: center; justify-content: space-between; padding: 0.65rem 0.85rem; background: rgba(11, 17, 32, 0.5); border: 1px solid var(--kite-card-border); border-radius: 8px; }
      .todo-item.done span { text-decoration: line-through; color: var(--kite-text-muted); }
      .todo-remove-btn { background: transparent; border: none; color: #ef4444; cursor: pointer; padding: 0.2rem 0.5rem; border-radius: 4px; }
      .todo-remove-btn:hover { background: rgba(239, 68, 68, 0.15); }
    </style>
  </head>
  <body>

    <!-- Topbar Navigation -->
    <div class="kite-topbar">
      <a href="../index.html" class="kite-back-link">
        <svg class="kite-icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        <span>Gallery</span>
      </a>
      <span class="kite-chip">⚡ Basics</span>
    </div>

    <!-- Main Card Container -->
    <div class="kite-card" kite-scope="{
      todos: [
        { text: 'Learn Kite reactivity', done: true },
        { text: 'Build a component', done: false },
        { text: 'Ship without a build step', done: false }
      ],
      newText: '',
      add() {
        if (!this.newText.trim()) return;
        this.todos.push({ text: this.newText.trim(), done: false });
        this.newText = '';
      },
      remove(idx) {
        this.todos.splice(idx, 1);
      }
    }">
      <h1 class="kite-title">✅ Task Manager</h1>
      <p class="kite-desc">Reactive lists, dynamic array mutation tracking, two-way input binding, and conditional styling.</p>

      <form class="todo-input-row" kite-on-submit.prevent="add()">
        <input class="kite-input" type="text" placeholder="What needs doing?..." kite-model="newText" required />
        <button class="kite-btn kite-btn-primary" type="submit">➕ Add</button>
      </form>

      <ul class="todo-list">
        <li class="todo-item" kite-for="(item, idx) in todos" kite-class:done="item.done">
          <label style="display: flex; align-items: center; gap: 0.65rem; cursor: pointer; flex: 1;">
            <input type="checkbox" kite-model="item.done" style="accent-color: var(--kite-primary); width: 1.1rem; height: 1.1rem;" />
            <span kite-text="item.text"></span>
          </label>
          <button class="todo-remove-btn" type="button" kite-on-click="remove(idx)" title="Remove item">🗑️</button>
        </li>
      </ul>

      <div style="margin-top: 1.25rem; font-size: 0.85rem; color: var(--kite-text-muted); display: flex; justify-content: space-between;">
        <span>Total: <strong kite-text="todos.length"></strong></span>
        <span>HTML is enough for small things</span>
      </div>
    </div>

    <!-- Official Banner Footer -->
    <footer class="kite-footer">
      <a href="../index.html" title="Kite Examples Gallery">
        <img src="../../assets/kite-banner.svg" alt="Kite Toolkit" class="kite-footer-banner">
      </a>
      <div class="kite-footer-meta">
        HTML is enough for small things &bull; <a href="../index.html">← All Examples</a>
      </div>
    </footer>

  </body>
</html>
